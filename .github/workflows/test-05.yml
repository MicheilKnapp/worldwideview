name: Test 05 Uses
on:
  push:
    branches: [test/gha-binsearch-1]
jobs:
  test:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: build
        run: echo "digest=abc123" >> "$GITHUB_OUTPUT"
